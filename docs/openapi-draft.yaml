openapi: 3.0.3
info:
  title: TiqueteVivo API (Draft)
  version: 0.1.0
  description: Draft OpenAPI describing the main Netlify Functions used by TiqueteVivo.
servers:
  - url: http://localhost:8888/.netlify/functions
    description: Local Netlify functions runner
  - url: https://{netlify_site}/.netlify/functions
    variables:
      netlify_site:
        default: your-site
        description: Netlify site name (replace)
paths:
  /create-order:
    post:
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  /create-payment-intent:
    post:
      summary: Create payment intent for an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
      responses:
        '200':
          description: Gateway payload (checkout/session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'

  /payments-webhook:
    post:
      summary: Payment gateway webhook (WOMPI/BOLD)
      description: |
        Receives provider webhook events. Implementation must validate signature
        using `WOMPI_EVENTS_SECRET` or gateway-specific secret. Endpoint stores raw_payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
      responses:
        '204':
          description: Accepted

  /list-orders:
    get:
      summary: List orders (filtered by business, status, date)
      parameters:
        - in: query
          name: business_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paged orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderResponse'
                  meta:
                    type: object

  /orders/{order_id}:
    parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: string
    get:
      summary: Get order by id
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    put:
      summary: Update an order (status, photos, fields)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Updated order
    delete:
      summary: Delete an order
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted

  /whatsapp/send:
    post:
      summary: Send WhatsApp template message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSendRequest'
      responses:
        '200':
          description: Message queued/sent

  /auth/login:
    post:
      summary: Admin/login (returns token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Auth token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /business/{business_id}/config:
    parameters:
      - in: path
        name: business_id
        required: true
        schema:
          type: string
    get:
      summary: Get business public config
      responses:
        '200':
          description: Business configuration
    post:
      summary: Save/update business config (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessConfig'
      responses:
        '200':
          description: Saved

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OrderCreate:
      type: object
      required: [business_id, customer_name, customer_phone, total]
      properties:
        business_id:
          type: string
        customer_name:
          type: string
        customer_phone:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              quantity:
                type: integer
              unit_price:
                type: number
        total:
          type: number
        photos:
          type: array
          items:
            type: string
            description: presigned URL or filename

    OrderResponse:
      type: object
      properties:
        id:
          type: string
        ticket_token:
          type: string
        business_id:
          type: string
        order_number:
          type: string
        customer_name:
          type: string
        customer_phone:
          type: string
        total:
          type: number
        paid:
          type: number
        balance:
          type: number
        status:
          type: string
        intake_photo_url:
          type: string
        delivery_photo_url:
          type: string
        created_at:
          type: string
          format: date-time

    OrderUpdate:
      type: object
      properties:
        status:
          type: string
        intake_photo_url:
          type: string
        delivery_photo_url:
          type: string

    PaymentIntentRequest:
      type: object
      required: [order_id, amount, currency]
      properties:
        order_id:
          type: string
        amount:
          type: number
        currency:
          type: string

    PaymentIntentResponse:
      type: object
      properties:
        gateway:
          type: string
        checkout_url:
          type: string
        session:
          type: object

    PaymentWebhookEvent:
      type: object
      properties:
        gateway:
          type: string
        event_type:
          type: string
        transaction_id:
          type: string
        order_reference:
          type: string
        amount:
          type: number
        raw_payload:
          type: object

    WhatsAppSendRequest:
      type: object
      required: [order_id, template_name]
      properties:
        order_id:
          type: string
        template_name:
          type: string
        variables:
          type: object

    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    BusinessConfig:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        slug:
          type: string
        config:
          type: object

tags: []
